apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dra-driver-dri
spec:
  groups:
    - name: dra-driver-dri
      rules:
        - alert: DRIPrepareErrors
          expr: increase(dri_prepare_errors_total[15m]) > 0
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.instance }}: GPU claims fail to prepare"
        - alert: DRIVRAMOverUse
          # used includes kernel/firmware memory, which the reserve (total - published) covers
          expr: dri_vram_used_bytes > dri_vram_allocated_bytes + (dri_vram_total_bytes - dri_vram_published_bytes) and dri_vram_allocated_bytes > 0
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.device }}: workloads use more VRAM than they claimed"
        - alert: DRIVRAMNearlyFull
          expr: dri_vram_used_bytes / dri_vram_total_bytes > 0.95
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.device }}: VRAM over 95 % used"
        - alert: DRIVRAMEvictedToRAM
          # Each Vulkan process keeps a few hundred MiB in GTT normally; with
          # VRAM full, buffers move there and the GPU slows down several times.
          expr: dri_gtt_used_bytes > 1073741824 and dri_vram_used_bytes / dri_vram_total_bytes > 0.9
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "{{ $labels.node }} {{ $labels.device }}: VRAM is full and buffers spill into system RAM"
        - alert: DRIGPUsSkipped
          expr: dri_gpus_skipped > 0
          for: 30m
          labels: {severity: info}
          annotations:
            summary: "{{ $labels.instance }}: GPUs found but not published (see plugin log)"
